# 后端服务池
upstream backend_api {
    server backend:8080;
    keepalive 32;
}

# 前端静态服务池
upstream frontend_static {
    server frontend:80;
    keepalive 16;
}

# HTTPS 虚拟主机
server {
    listen 443 ssl;
    server_name washy.xylanny.site;

    ssl_certificate     /etc/nginx/ssl/washy.xylanny.site.pem;
    ssl_certificate_key /etc/nginx/ssl/washy.xylanny.site.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m; # SSL会话缓存
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://frontend_static;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP自动跳转HTTPS
server {
    listen 80;
    server_name washy.xylanny.site;
    return 301 https://$server_name$request_uri;
}
