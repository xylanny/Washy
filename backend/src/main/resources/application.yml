server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_DATASOURCE_URL}
    username: ${MYSQL_DATASOURCE_USERNAME}
    password: ${MYSQL_DATASOURCE_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
auth:
  token-secret: ${AUTH_TOKEN_SECRET}
  token-expire-seconds: 2592000
app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGINS:}
ai:
  # DeepSeek（OpenAI 兼容协议）
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com
  # deepseek-flash 同时支持文本与图片输入
  model: deepseek-flash
  vision-model: deepseek-flash
  vision-enabled: true
  timeout-seconds: 120
  connect-timeout-seconds: 10
  temperature: 0.7
  max-tokens: 4096
  max-retries: 3
  max-images: 4
  max-image-bytes: 8388608
  max-context-chars: 12000
  max-history-messages: 20
  stream-pool-size: 8

