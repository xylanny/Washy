server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    # 465 = 隐式 TLS（QQ/163 等邮箱的默认端口），587 = STARTTLS。
    # 这两个开关必须和端口匹配：只开 starttls 去连 465，会以明文去连 TLS 端口，
    # 服务器不会返回欢迎语，于是报
    # "Got bad greeting from SMTP host: smtp.qq.com, port: 465, response: [EOF]"。
    # 用 587 时设置 MAIL_SSL_ENABLE=false、MAIL_STARTTLS_ENABLE=true。
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
          # 避免 SMTP 卡住把注册请求一起拖死
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_DATASOURCE_URL}
    username: ${MYSQL_DATASOURCE_USERNAME}
    password: ${MYSQL_DATASOURCE_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
auth:
  token-secret: ${AUTH_TOKEN_SECRET}
  token-expire-seconds: 2592000
app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGINS:}
ai:
  # DeepSeek（OpenAI 兼容协议）
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com
  # deepseek-flash 同时支持文本与图片输入
  model: deepseek-flash
  vision-model: deepseek-flash
  vision-enabled: true
  timeout-seconds: 120
  connect-timeout-seconds: 10
  temperature: 0.7
  max-tokens: 4096
  max-retries: 3
  max-images: 4
  max-image-bytes: 8388608
  max-context-chars: 12000
  max-history-messages: 20
  stream-pool-size: 8

